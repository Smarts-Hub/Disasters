# Useful links:
# - https://discord.smartshub.dev -> support

# Available drivers: h2, mysql
# If you are using h2, you don't need to specify the host, port, db-name,
# username and password due to h2 is local database.
database:
  driver: h2
  host: 101.101.101.101
  port: 3306
  db-name: disasters
  username: userNaMeForDisasters
  password: passw0rD

# This is the location where players will return after the game ends
# (Used when bungee mode is disabled)
lobby:
  world: world
  x: 0
  y: 64
  z: 0
  yaw: 0
  pitch: 0

# BungeeCord/Velocity support
# When enabled, players are sent to a different backend server at game end
# instead of being teleported to the lobby location above.
bungee:
  enabled: false
  server: "lobby"

enable-scoreboard: true

# Active disaster scoreboard section.
show-active-disasters: true

# Game modifications are voted at match start and remain active for the full match.
game-modifications:
  voting:
    enabled: true
    inventory-title: "<gold><bold>Vote Game Modification"
    allow-no-vote-default: true
    default: one-heart
    open-at-countdown-start: true
  swapper:
    interval-seconds: 10
  one-heart:
    health: 2.0

# Disaster runtime controls.
disasters:
  max-simultaneous-disasters: 4
  default-duration-seconds: 60
  default-max-triggers: 30
  per-disaster:
    lightning:
      duration-seconds: 60
      max-triggers: 30
      warning-ticks: 20
    apocalypse:
      duration-seconds: 90
      max-triggers: 30
    flood:
      duration-seconds: 90
      max-triggers: 0
      rise-interval-seconds: 4
      max-blocks-per-pulse: 2500
    lava-rising:
      duration-seconds: 75
      max-triggers: 0
      rise-interval-seconds: 5
      max-blocks-per-pulse: 2500
    tnt-rain:
      duration-seconds: 45
      max-triggers: 30
    anvil-rain:
      duration-seconds: 45
      max-triggers: 30
    tornado:
      duration-seconds: 45
      max-triggers: 0
    simon-says:
      duration-seconds: 45
      max-triggers: 8
    hot-potato:
      duration-seconds: 45
      max-triggers: 3
    sinkhole:
      duration-seconds: 45
      max-triggers: 12
    pillager-invasion:
      duration-seconds: 45
      max-triggers: 3
    freeze:
      duration-seconds: 8
      max-triggers: 1
    landmine:
      duration-seconds: 45
      max-triggers: 30
    size-change:
      duration-seconds: 30
      max-triggers: 1
    bat-swarm:
      duration-seconds: 35
      max-triggers: 0
    nuke:
      duration-seconds: 35
      max-triggers: 1
    covid-19:
      duration-seconds: 45
      max-triggers: 1
    disco:
      duration-seconds: 45
      max-triggers: 0
    red-light-green-light:
      duration-seconds: 45
      max-triggers: 0
    mirror-controls:
      duration-seconds: 35
      max-triggers: 0

# Enable or disable item drops during games (configure drops in item-drops.yml)
enable-item-drops: true

# Damage dealt by the Hot Sun disaster every second (0.5 = 1/4 heart)
hot-sun-damage: 0.5

# DO NOT TOUCH THIS!
config-version: 2
